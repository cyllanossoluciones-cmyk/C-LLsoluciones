<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>N.F.T.A-CORP — Construyendo sitio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
      text-align: center;
      padding: 20px;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 900px;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #fff, #888, #fff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 3s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    .loader {
      display: inline-block;
      border: 6px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      border-radius: 50%;
      width: 70px;
      height: 70px;
      animation: spin 1s linear infinite;
      margin: 30px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    p.org {
      font-size: clamp(1rem, 3vw, 1.5rem);
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    p.org em {
      font-style: normal;
      color: #fff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
    }

    p.tagline {
      color: #bbb;
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .dots {
      display: inline-block;
      font-size: clamp(1rem, 3vw, 1.5rem);
    }

    .dots span {
      display: inline-block;
      animation: dot 1.4s ease-in-out infinite;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot {
      0%, 100% { opacity: 0.2; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-6px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Construyendo sitio</h1>

    <div class="loader" aria-hidden="true"></div>

    <p class="org">
      <em>N.F.T.A&#8209;CORP</em> est&aacute; trabajando en ello
      <span class="dots">
        <span>.</span><span>.</span><span>.</span>
      </span>
    </p>

    <p class="tagline">Pr&oacute;ximamente disponible. Vuelve pronto.</p>
  </div>
</body>
</html>
